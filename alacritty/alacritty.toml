[general]
import = ["~/.config/alacritty/themes/alacritty/dracula.toml"]

[colors.primary]
background = "#0F0F0F"

[window]
option_as_alt = "Both"

[font]
size = 12.0

[cursor]
thickness = 0.2
blink_timeout = 0

[cursor.style]
shape = "Beam"
blinking = "Always"

[selection]
save_to_clipboard = true

[colors]
cursor = { text = "0xFFFFFF", cursor = "0xFFFFFF" }
